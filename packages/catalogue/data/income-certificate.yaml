# ============================================================================
# income-certificate — gold service for UPNIC-004
# ----------------------------------------------------------------------------
# Written on 2026-10-17 from official Uttar Pradesh government pages, read on that
# date. Every row carries the URL it was taken from plus the date it was read, and
# packages/catalogue/validate.mjs fails the build if a row is missing either one or
# still holds VERIFY_OFFICIAL.
#
# WHAT IS VERIFIED (the app answers these):
#   fees            e-District UP service list, "सेवा शुल्क (w.e.f 13/01/2021) ₹15"
#   documents       e-District "संलग्नक सूची" + Ghaziabad district page
#   eligibility     the Aadhaar e-KYC sentences printed under "आय प्रमाणपत्र"
#   channel+steps   the e-District FAQ answers on applying online / at a CSC counter
#   office          "तहसीलदार द्वारा जारी" + the CSC/Lokwani deposit instruction
#   next_steps      the FAQ answers on status, verification, download, rejection
#   escalation      Jansunwai-Samadhan portal + the CeG Help Desk number
#   faqs            the FAQ answers themselves
#
# WHAT IS STILL VERIFY_OFFICIAL (the app refuses these, with office + helpline):
#   sla.days        no official page read so far states the promised number of days.
#                   The FAQ says "अगर मेरा आवेदन निर्दिष्ट दिनों से अधिक स्थिति में रहे"
#                   — a stipulated period exists and is not published on that page.
#   eligibility     whether an income ceiling or resident test applies is not published
#                   on the income-certificate section of the service list.
# Finding the two above is Phase 1.4's remaining data duty: the UP citizen charter
# documents (sedup / district collectorate pages) are the next places to read.
#
# Sources, all on the official-host allowlist (.gov.in / .nic.in):
#   S1 https://edistrict.up.gov.in/eDistrictup/Services/services_hi.aspx
#   S2 https://edistrict.up.gov.in/edistrictup/                  (FAQ block)
#   S3 https://ghaziabad.nic.in/%E0%A4%86%E0%A4%AF-%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%AE%E0%A4%BE%E0%A4%A3-%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0/
#   S4 https://meerutdivision.nic.in/project/vigilance-cell/     (e-District contact block)
#   S5 https://jansunwai.up.nic.in/?language=en_US                (grievance portal)
# Where S1 and S3 list different attachment sets, both lists are kept: S3 is a
# district page restating the same service, and a citizen may be asked for either.
# ============================================================================

service_id: income-certificate
state: UP
district_scope: state          # switch to a district code once overrides/ is used

lang:
  hi:
    name: "आय प्रमाण पत्र"
    aliases:
      - "income certificate"
      - "ay praman patra"
      - "income certificate kaise banaye"
      - "aay ki praman patra"
      - "आय प्रमाण पत्र"
      - "आय प्रमाण पत्र का फार्म"
      - "income certificate ka form"
      - "aay praman patra kaise bane"
  en:
    name: "Income Certificate"
    aliases:
      - "income certificate"
      - "earnings certificate"
      - "how to apply for income certificate in UP"
      - "income certificate fee"
      - "income certificate documents"

# ----------------------------------------------------------------------------
# S1: "आय प्रमाण पत्र की सेवाएं आधार ई-केवाईसी सत्यापित होने के बाद ही उपलब्ध
# होंगी अतः आवेदक का आधार नंबर अनिवार्य है। आवेदक के पहचान की जानकारी केवल
# प्रमाण पत्र प्राप्त करने के लिए उपयोग की जाएगी तथा आवेदक का बायोमेट्रिक्स
# संग्रहीत/साझा नहीं किया जायेगा ।"
# S2 (FAQ "अगर मेरे पास वैध आधार संख्या नहीं है"): Aadhaar is mandatory for caste,
# income and domicile; a ration card or voter ID copy can serve as ID for
# registration and the other e-District services.
# ----------------------------------------------------------------------------
eligibility:
  - text:
      hi: "आवेदक का आधार नंबर अनिवार्य है। आय प्रमाण पत्र की सेवा आधार ई-केवाईसी सत्यापित होने के बाद ही उपलब्ध होती है; आपकी पहचान की जानकारी केवल प्रमाण पत्र प्राप्त करने के लिए उपयोग की जाती है और आपका बायोमेट्रिक्स संग्रहीत या साझा नहीं किया जाता।"
      en: "The applicant's Aadhaar number is required. The income certificate is available only after Aadhaar e-KYC verification; your identity information is used only to deliver the certificate and your biometrics are neither stored nor shared."
    source_url: "https://edistrict.up.gov.in/eDistrictup/Services/services_hi.aspx"
    verified_on: "2026-10-17"
  - text:
      hi: "जाति, आय और निवास प्रमाण पत्र के लिए आधार संख्या अनिवार्य है; पंजीकरण या अन्य ई-डिस्ट्रिक्ट सेवाओं के लिए आप पहचान के प्रमाण के रूप में राशन कार्ड या चुनाव आईडी कार्ड की प्रति उपयोग कर सकते हैं।"
      en: "An Aadhaar number is mandatory for caste, income and domicile certificates; for registration or other e-District services a copy of your ration card or voter ID card can be used as proof of identity."
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  # NOT VERIFIED: whether an income ceiling or a residence test decides eligibility.
  # No official page read so far publishes one. This row is what keeps a question
  # about "कितनी कमाई पर आय प्रमाण पत्र मिलेगा" inside the refusal ladder.
  - text:
      hi: "VERIFY_OFFICIAL"
      en: "VERIFY_OFFICIAL"
    source_url: "https://VERIFY_OFFICIAL"
    verified_on: "0000-00-00"

# ----------------------------------------------------------------------------
# S1 "संलग्नक सूची" for आय प्रमाणपत्र: 1. स्वप्रमाणित घोषणा पत्र 2. राशन कार्ड की
# छाया प्रति 3. वेतन भोगी होने की दशा में अद्यतन वेतन पर्ची.
# S3 adds: निर्धारित प्रारूप पर प्रार्थना पत्र, पासपोर्ट साइज़ फोटो.
# `copies`, `format` and any upload size that the page does not state are left out
# rather than guessed; the photograph/document size limits live in faqs with their
# own citation because they are portal upload rules, not per-document rules.
# ----------------------------------------------------------------------------
documents:
  - item:
      hi: "निर्धारित प्रारूप पर प्रार्थना पत्र"
      en: "Application in the prescribed format"
    who: applicant
    source_url: "https://ghaziabad.nic.in/%E0%A4%86%E0%A4%AF-%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%AE%E0%A4%BE%E0%A4%A3-%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0/"
    verified_on: "2026-10-17"
  - item:
      hi: "स्वप्रमाणित घोषणा पत्र"
      en: "Self-attested declaration"
    who: applicant
    attestation: true
    source_url: "https://edistrict.up.gov.in/eDistrictup/Services/services_hi.aspx"
    verified_on: "2026-10-17"
  - item:
      hi: "राशन कार्ड की छाया प्रति"
      en: "Photocopy of the ration card"
    who: applicant
    source_url: "https://edistrict.up.gov.in/eDistrictup/Services/services_hi.aspx"
    verified_on: "2026-10-17"
  - item:
      hi: "वेतनभोगी होने की दशा में अद्यतन वेतन पर्ची"
      en: "Updated salary slip, if the applicant is salaried"
    who: applicant
    source_url: "https://edistrict.up.gov.in/eDistrictup/Services/services_hi.aspx"
    verified_on: "2026-10-17"
  - item:
      hi: "पासपोर्ट साइज़ फोटो"
      en: "Passport-size photograph"
    who: applicant
    source_url: "https://ghaziabad.nic.in/%E0%A4%86%E0%A4%AF-%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%AE%E0%A4%BE%E0%A4%A3-%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0/"
    verified_on: "2026-10-17"

# ----------------------------------------------------------------------------
# S1 prints two fee lines under आय प्रमाणपत्र: "सेवा शुल्क (w.e.f 16/11/2020) ₹30"
# and "सेवा सेवा शुल्क (w.e.f 13/01/2021) ₹15". The later date is the operative one,
# so ₹15 is the answer and the ₹30 line becomes an FAQ instead of a second fee row
# (two rows would read as two charges a citizen has to pay).
# `mode: either` is derived from the two published channels — the portal itself
# (S2, citizen portal) and a CSC/Lokwani counter deposit (S2) — not from a payment
# page. `free_below_income_inr` stays null: no official waiver was found.
# ----------------------------------------------------------------------------
fees:
  - item:
      hi: "आय प्रमाण पत्र का सेवा शुल्क (13 जनवरी 2021 से प्रवर्तमान)"
      en: "Income certificate service fee (effective 13 January 2021)"
    amount_inr: 15
    mode: either
    free_below_income_inr: null
    source_url: "https://edistrict.up.gov.in/eDistrictup/Services/services_hi.aspx"
    verified_on: "2026-10-17"

# ----------------------------------------------------------------------------
# NOT VERIFIED. The pages read so far do not publish a number of days, so this block
# keeps the sentinel and any "कितने दिन लगेंगे" question goes to the refusal ladder
# with the office and the help-desk number. Do not fill this from an aggregator.
# ----------------------------------------------------------------------------
sla:
  days: 0                       # VERIFY_OFFICIAL
  scope:
    hi: "VERIFY_OFFICIAL — याद रखें: 'आवेदन से वितरण तक' या 'सत्यापन से वितरण तक'?"
    en: "VERIFY_OFFICIAL — record which stage the clock starts at"
  source_url: "https://VERIFY_OFFICIAL"
  verified_on: "0000-00-00"

# ---------------------------------------------------------------------------
# channel[].steps = the step-reduction BASELINE. Counted from the official pages on
# 2026-10-17, exactly as published, not "improved". needs_visit=true only for a
# physical trip. The CSC list is shorter than the online one because the centre
# performs the data entry and upload — which is why the baseline counts visits as
# the stronger unit, not taps. Slide 8 is measured against these numbers.
# ---------------------------------------------------------------------------
channel:
  - kind: online
    steps:
      - n: 1
        action: { hi: "नागरिक पोर्टल (ई-साथी) पर पंजीकरण करें और लॉगिन करें", en: "Register and log in on the citizen portal (e-Sathi)" }
        needs_visit: false
      - n: 2
        action: { hi: "निर्धारित प्रारूप पर आवेदन भरें", en: "Fill the application in the prescribed format" }
        needs_visit: false
      - n: 3
        action: { hi: "फोटो (50 केबी तक) और सहायक दस्तावेज़ (100 केबी से अधिक नहीं) अपलोड करें", en: "Upload the photograph (up to 50 KB) and supporting documents (not above 100 KB)" }
        needs_visit: false
      - n: 4
        action: { hi: "स्वप्रमाणित घोषणा पत्र संलग्न करें", en: "Attach the self-attested declaration" }
        needs_visit: false
      - n: 5
        action: { hi: "सेवा शुल्क (₹15) देकर आवेदन जमा करें", en: "Pay the service fee (Rs 15) and submit the application" }
        needs_visit: false
      - n: 6
        action: { hi: "होम पेज पर 'आवेदन की स्थिति' से आवेदन की स्थिति देखें", en: "Check the application under 'आवेदन की स्थिति' (application status) on the home page" }
        needs_visit: false
      - n: 7
        action: { hi: "स्वीकृति के बाद पंजीकृत खाते से डिजिटल हस्ताक्षरित प्रमाण पत्र डाउनलोड करें", en: "After approval, download the digitally signed certificate from your registered account" }
        needs_visit: false
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - kind: csc
    steps:
      - n: 1
        action: { hi: "निर्धारित प्रारूप का आवेदन पत्र भरें और पासपोर्ट साइज़ फोटो चिपकाएँ", en: "Fill the prescribed application form and put a passport-size photograph on it" }
        needs_visit: false
      - n: 2
        action: { hi: "स्वप्रमाणित घोषणा पत्र और सहायक दस्तावेज़ों की प्रतियाँ साथ रखें", en: "Keep the self-attested declaration and copies of the supporting documents ready" }
        needs_visit: false
      - n: 3
        action: { hi: "नजदीकी सीएससी / लोकवाणी केंद्र पर जाकर आवेदन जमा करें", en: "Go to the nearest CSC / Lokwani centre and deposit the application" }
        needs_visit: true
      - n: 4
        action: { hi: "बाद में ई-डिस्ट्रिक्ट होम पेज से आवेदन की स्थिति देखें", en: "Later check the application status on the e-District home page" }
        needs_visit: false
      - n: 5
        action: { hi: "स्वीकृति के बाद डिजिटल हस्ताक्षरित प्रमाण पत्र प्राप्त/डाउनलोड करें", en: "After approval, obtain or download the digitally signed certificate" }
        needs_visit: false
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"

# ----------------------------------------------------------------------------
# S1 (under छात्रवृत्ति services) states the issuer of an income certificate:
# "अभिभावक का आय प्रमाण पत्र जो तहसीलदार द्वारा जारी किया गया हो". S2 states where a
# citizen deposits the application: "सीएससी/लोकवाणी केंद्र पर जमा करना होगा". The
# issuance fact is also carried as an FAQ so the two citations stay separable.
# ----------------------------------------------------------------------------
office:
  type: [tehsil, csc]
  how_to_find:
    hi: "आवेदन किसी भी सीएससी / लोकवाणी केंद्र पर जमा किया जाता है; प्रमाण पत्र तहसीलदार द्वारा जारी होता है।"
    en: "Applications are deposited at any CSC / Lokwani centre; the certificate is issued by the Tahsildar."
  source_url: "https://edistrict.up.gov.in/edistrictup/"
  verified_on: "2026-10-17"

# ----------------------------------------------------------------------------
# S5: Jansunwai-Samadhan (UP government grievance portal) — register a grievance,
# track it by registered mobile number, send a reminder when the stipulated time is
# crossed. S4: the e-District UP project page of the Meerut Division lists the CeG
# Help Desk contact 0522-2304706. This is the verified number the refusal ladder
# offers; without it a refusal would have nothing to hand the citizen.
# ----------------------------------------------------------------------------
escalation:
  - when:
      hi: "आवेदन निर्दिष्ट दिनों से अधिक समय तक एक ही स्थिति पर रहे"
      en: "The application stays in the same state longer than the stipulated number of days"
    do:
      hi: "जिले के संबंधित अनुमोदन प्राधिकारी से संपर्क करें"
      en: "Contact the concerned approval authority of your district"
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - when:
      hi: "शिकायत दर्ज करानी हो या समय पार हो जाने पर अनुस्मारक भेजना हो"
      en: "You need to lodge a complaint or send a reminder after the deadline has passed"
    do:
      hi: "जनसुविधा–समाधान पोर्टल पर शिकायत दर्ज करें और पंजीकृत मोबाइल नंबर से उसकी स्थिति ट्रैक करें"
      en: "Register the grievance on the Jansunwai-Samadhan portal and track it with your registered mobile number"
    contact: "https://jansunwai.up.nic.in"
    source_url: "https://jansunwai.up.nic.in/?language=en_US"
    verified_on: "2026-10-17"
  - when:
      hi: "ई-डिस्ट्रिक्ट पोर्टल या उसकी सेवाओं से जुड़ी सहायता चाहिए हो"
      en: "You need help with the e-District portal or the services it carries"
    do:
      hi: "सीईजी हेल्प डेस्क (ई-डिस्ट्रिक्ट उत्तर प्रदेश) से संपर्क करें"
      en: "Contact the CeG Help Desk of e-District Uttar Pradesh"
    contact: "0522-2304706"
    source_url: "https://meerutdivision.nic.in/project/vigilance-cell/"
    verified_on: "2026-10-17"

# 'what happens next' — the brief's core complaint. eta_days stays null because no
# official page publishes the duration of each state (see sla above).
next_steps:
  - status: applied
    means:
      hi: "आवेदन जमा हो गया है; ई-डिस्ट्रिक्ट होम पेज पर 'आवेदन की स्थिति' लिंक से स्थिति देखी जा सकती है।"
      en: "The application is filed; its status can be seen under the 'आवेदन की स्थिति' (application status) link on the e-District home page."
    eta_days: null
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - status: verified
    means:
      hi: "दस्तावेज़ सत्यापन हो रहा है; सत्यापन के समय आवश्यक संलग्नक नहीं मिला तो आवेदन अस्वीकार कर दिया जाता है।"
      en: "The documents are being verified; if a required enclosure is not found during verification the application is rejected."
    eta_days: null
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - status: delivered
    means:
      hi: "आवेदन स्वीकृत होने के बाद पंजीकृत नागरिक पोर्टल खाते में डिजिटल हस्ताक्षरित प्रमाण पत्र डाउनलोड करने का लिंक मिलता है (प्रमाण पत्र खोलने के लिए ब्राउज़र में पॉप-अप चालू रखें)।"
      en: "Once the application is approved, the digitally signed certificate appears as a download link in your registered citizen-portal account (keep browser pop-ups enabled to open it)."
    eta_days: null
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - status: rejected
    means:
      hi: "अस्वीकृत आवेदन पर आगे कोई कार्रवाई नहीं होती; दस्तावेज़ पूरे करके दोबारा आवेदन करें और अस्वीकृति के कारण के लिए जिले के अनुमोदन प्राधिकारी से संपर्क करें।"
      en: "A rejected application is not acted upon further; complete the documents and apply again, and contact the district's approval authority for the reason of rejection."
    eta_days: null
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"

faqs:
  - q:
      hi: "ऑनलाइन आवेदन में फोटो और दस्तावेज़ का आकार कितना होना चाहिए?"
      en: "What size should the photograph and documents be for an online application?"
    a:
      hi: "फोटो की फ़ाइल 50 केबी तक होनी चाहिए और अन्य दस्तावेज़ का आकार 100 केबी से अधिक नहीं; दोनों स्पष्ट और पढ़ने योग्य होने चाहिए।"
      en: "The photograph file should be up to 50 KB and no other document above 100 KB; both must be clear and legible."
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - q:
      hi: "आय प्रमाण पत्र कहाँ काम आता है?"
      en: "Where is an income certificate used?"
    a:
      hi: "सरकारी रोज़गार प्राप्त करने, विद्यालयों में प्रवेश और आंशिक/पूर्ण शुल्क छूट, तथा सरकार द्वारा दी जाने वाली योजनाओं के लाभ के लिए।"
      en: "For obtaining government employment, school admission and partial or full fee exemption, and for the benefits of government schemes."
    source_url: "https://ghaziabad.nic.in/%E0%A4%86%E0%A4%AF-%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%AE%E0%A4%BE%E0%A4%A3-%E0%A4%AA%E0%A4%A4%E0%A5%8D%E0%A4%B0/"
    verified_on: "2026-10-17"
  - q:
      hi: "क्या अपलोड किए गए दस्तावेज़ में बाद में बदलाव या हटाना संभव है?"
      en: "Can an uploaded document be edited or removed later?"
    a:
      hi: "नहीं, एक बार दस्तावेज़ अपलोड हो जाने के बाद उसे संपादित, हटाया या अपडेट नहीं किया जा सकता।"
      en: "No. Once a document has been uploaded it cannot be edited, removed or updated."
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - q:
      hi: "शुल्क की सूची में ₹30 और ₹15 दोनों दिखते हैं, कौन सा लागू होता है?"
      en: "The fee list shows both Rs 30 and Rs 15 — which one applies?"
    a:
      hi: "ई-डिस्ट्रिक्ट की सेवा सूची में दोनों पंक्तियाँ छपी हैं: ₹30 (16/11/2020 से) और ₹15 (13/01/2021 से)। बाद वाली तारीख का मान प्रवर्तमान है, यानी ₹15।"
      en: "The e-District service list prints both lines: Rs 30 (w.e.f. 16/11/2020) and Rs 15 (w.e.f. 13/01/2021). The later date is the operative value, i.e. Rs 15."
    source_url: "https://edistrict.up.gov.in/eDistrictup/Services/services_hi.aspx"
    verified_on: "2026-10-17"
  - q:
      hi: "मेरा जारी प्रमाण पत्र edistrict.up.gov.in पर ऑनलाइन सत्यापित नहीं हो रहा, क्या करूँ?"
      en: "My issued certificate does not verify online on edistrict.up.gov.in — what should I do?"
    a:
      hi: "अपने मूल प्रमाण पत्र के साथ संबंधित जिला प्रशासन / अनुमोदन प्राधिकारी से संपर्क करें।"
      en: "Contact the concerned district administration / approval authority with your original certificate."
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - q:
      hi: "ऑनलाइन आवेदन करने के बाद काउंटर पर कौन से दस्तावेज़ जमा करने होते हैं?"
      en: "After applying online, which documents still have to be deposited at a counter?"
    a:
      hi: "भरा हुआ निर्धारित आवेदन पत्र, पासपोर्ट साइज़ फोटो, स्व-घोषणा प्रमाण पत्र और सेवा के अन्य सहायक दस्तावेज़ों की प्रतियाँ सीएससी / लोकवाणी केंद्र पर जमा करनी होती हैं।"
      en: "The filled prescribed form, a passport-size photograph, the self-declaration and copies of the other supporting documents have to be deposited at a CSC / Lokwani centre."
    source_url: "https://edistrict.up.gov.in/edistrictup/"
    verified_on: "2026-10-17"
  - q:
      hi: "आय प्रमाण पत्र के लिए आय की कोई सीमा तय है?"
      en: "Is there an income limit for getting an income certificate?"
    a:
      hi: "ई-डिस्ट्रिक्ट का आय प्रमाण पत्र अनुभाग किसी आय सीमा प्रकाशित नहीं करता, इसलिए यहाँ उसका कोई मान नहीं दिया गया है; पात्रता की पुष्टि तहसीलदार / अनुमोदन प्राधिकारी से करें।"
      en: "The income-certificate section of e-District publishes no income limit, so no value is stored here; confirm eligibility with the Tahsildar / approval authority."
    source_url: "https://edistrict.up.gov.in/eDistrictup/Services/services_hi.aspx"
    verified_on: "2026-10-17"

