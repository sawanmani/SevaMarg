distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
# Pinned deliberately (docs/PROJECT_STRUCTURE.md "Pinned tooling"). Every machine and CI run uses
# this exact Gradle, so "works on my laptop" cannot be a demo failure mode. 9.3.1 is also the first
# Gradle that runs on the only JDK we have installed (26) - regenerate the wrapper with
# `gradlew wrapper --gradle-version <v> --distribution-type bin` and re-check :core:test.
distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
