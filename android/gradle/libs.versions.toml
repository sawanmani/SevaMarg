# android/gradle/libs.versions.toml
# Single source of truth for versions (docs/PROJECT_STRUCTURE.md "Pinned tooling").
# Rule: bump deliberately, in its own commit, never as a side effect of a feature branch.
#
# Resolved against a real machine (2026-10-17, Windows, JDK 26.0.1 only, Android SDK at C:\android-sdk):
# every entry below is what `gradlew :app:assembleDebug` actually pulled. The TO VERIFY marks are gone
# from the build/toolchain rows because the first real build turned them into facts; the speech rows
# are still unverified because the Phase 1 spike has not run.

[versions]
# SDK numbers live here as strings because Gradle only generates accessors for [versions];
# module build files call .toInt() on them. One place, four modules, no drift.
compileSdk = "35"
minSdk = "26"          # Android 8.0 - the budget/Android Go devices in our matrix are 12/Go
targetSdk = "35"
# compileSdk was 34 in the plan; the first real :app:assembleDebug refused it - androidx.core 1.15.0
# ships AAR metadata requiring compileSdk >= 35. 35 rather than 36 is the measured choice, not the
# cautious one: platform 36 is installed here and the test device runs Android 16 / API 36, but
# compiling against 36 pulled javac onto a path that needs an Android system-modules image, and
# jlink from the only JDK on this machine (26.0.1) rejects the java.base inside android-36.jar
# ("cannot find the build signature"). 35's jar works. A compileSdk below the device API is normal:
# targetSdk, not compileSdk, is the behavioural switch, so the app still runs on the API 36 phone.
# Raising it to 36 is a toolchain question for the machine, not a product one. minSdk is untouched: the
# budget-phone claim is about the low end, not the high end.
# Not a toolchain request. `jvmToolchain(17)` needs a JDK 17 *installed* (or a toolchain resolver
# plugin that downloads one), and neither exists on the build machines we control - the only JDK is
# 26. So we compile with the launcher JVM and pin the *target* to 17, which is the bytecode level
# D8/AGP expect. Same artifact on a JDK 17 or a JDK 26 machine, no download, no "toolchain not found".
javaJvmTarget = "17"
agp = "8.13.1"
kotlin = "2.2.21"
coreKtx = "1.15.0"
lifecycle = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.12.01"
navigationCompose = "2.8.5"
room = "2.6.1"
datastore = "1.1.1"
work = "2.9.1"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
documentfile = "1.0.1"
junit = "5.11.3"
junitVintage = "5.11.3"
# Gradle 9 does not ship the JUnit Platform launcher any more: every module that calls
# useJUnitPlatform() must put junit-platform-launcher on the test runtime classpath, or the test task
# fails with "Failed to load JUnit Platform". Version = the platform under JUnit 5.11.3.
junitPlatform = "1.11.3"
androidxJunit = "1.2.1"
espresso = "3.6.1"
robolectric = "4.13.2"
uiautomator = "2.3.0"
# --- speech: coordinates are pending the Phase 1 spike (ADR-0003) -----------------
vosk = "0.17.15"          # TO VERIFY: Android artifact coordinate + Hindi model id/size
sherpaOnnx = "1.10.0"     # TO VERIFY: Piper-via-sherpa-onnx Android artifact

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui-accessibility = { group = "androidx.compose.ui", name = "ui-accessibility" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-datastore-preferences = { group = "androidx.datastore", name = "datastore-preferences", version.ref = "datastore" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-documentfile = { group = "androidx.documentfile", name = "documentfile", version.ref = "documentfile" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
junit-jupiter = { group = "org.junit.jupiter", name = "junit-jupiter", version.ref = "junit" }
junit-platform-launcher = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junitPlatform" }
junit-vintage-engine = { group = "org.junit.vintage", name = "junit-vintage-engine", version.ref = "junitVintage" }
androidx-test-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxJunit" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espresso" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# versionless: :bench is a plain JVM main() runner, so it needs Gradle's own application plugin
jvm-application = { id = "application" }
