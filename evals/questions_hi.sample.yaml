# Hindi in-scope evaluation set — 12 of the required 50 seeded here.
# `expected` is the answer key: the exact catalogue fields that must appear in the
# composed answer. qa_accuracy.py scores exact field match -> results/qa/hi.json
# Phrasings are deliberately colloquial (Hinglish, no devanagari typing) because
# that is what ASR actually returns from a real caller.
- id: hi-001
  ask: "income certificate ke liye kya kya document chahiye hota hai"
  service: income-certificate
  expect_fields: [documents]
  must_not_say: ["aapke liye eligible hai", "guarantee"]
- id: hi-002
  ask: "aay praman patra kitne din me milta hai"
  service: income-certificate
  expect_fields: [sla]
- id: hi-003
  ask: "income certificate ki fees kitni hai"
  service: income-certificate
  expect_fields: [fees]
- id: hi-004
  ask: "income certificate kahan se banega mere area me"
  service: income-certificate
  expect_fields: [office]
- id: hi-005
  ask: "aay praman patra ke liye kahan jana padega aur kitna kharcha hoga"
  service: income-certificate
  expect_fields: [office, fees]
- id: hi-006
  ask: "form bhar diya ab aage kya hoga"
  service: income-certificate
  intent: next_steps
  expect_fields: [next_steps]
- id: hi-007
  ask: "sath din se application pending hai koi shikayat kaise karu"
  service: income-certificate
  intent: escalation
  expect_fields: [escalation]
- id: hi-008
  ask: "mujhe income certificate chahiye kaise banaye"
  service: income-certificate
  expect_fields: [eligibility, documents, fees, sla, office]
- id: hi-009
  ask: "online application bheja tha, uska status kaise dekh sakte hain"
  service: income-certificate
  intent: status_lookup
  expect_fields: [next_steps]
- id: hi-010
  ask: "kya majdoor ka bacha income certificate le sakta hai"
  service: income-certificate
  expect_fields: [eligibility]
- id: hi-011
  ask: "residence certificate ke liye kitne saal ka rahna zaroori hai"
  service: residence-certificate
  expect_fields: [eligibility]
- id: hi-012
  ask: "birth certificate online apply karne ke baad office jaana padta hai kya"
  service: birth-certificate
  expect_fields: [channel]
